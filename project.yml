name: NV2ray
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
targets:
  NV2ray:
    type: application
    platform: macOS
    sources:
      - path: Sources/NV2ray
    info:
      path: Config/App-Info.plist
    entitlements:
      path: Config/NV2ray.entitlements
    dependencies:
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.junsl2.NV2ray
        PRODUCT_NAME: NV2ray
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  PacketTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: PacketTunnel
    info:
      path: Config/PacketTunnel-Info.plist
    entitlements:
      path: Config/PacketTunnel.entitlements
    dependencies:
      - framework: Vendor/Library.framework
        embed: true
      - framework: Vendor/Libbox.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.junsl2.NV2ray.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
