name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate package
        run: swift package dump-package

      - name: Build
        id: swift-build
        continue-on-error: true
        run: |
          set -o pipefail
          swift build 2>&1 | tee swift-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-build-log
          path: swift-build.log

      - name: Fail when build failed
        if: steps.swift-build.outcome == 'failure'
        run: exit 1

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure protected mode has no default direct path
        run: |
          grep -q 'config.tunnel.killSwitch ? "proxy"' Sources/NV2ray/RuntimeConfigBuilder.swift
          grep -q 'ruleSetDetour = config.tunnel.killSwitch ? "proxy" : "direct"' Sources/NV2ray/RuntimeConfigBuilder.swift
          grep -q 'effectiveAction(for rule: RouteRule, config: AppConfiguration)' Sources/NV2ray/RuntimeConfigBuilder.swift
          grep -q 'systemDNSWithKillSwitch' Sources/NV2ray/ConfigurationValidator.swift
          grep -q 'directModeWithKillSwitch' Sources/NV2ray/ConfigurationValidator.swift
